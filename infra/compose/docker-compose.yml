---
name: ici-archivos

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/compose/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/compose/.env}
      ICI_APP_DB_USER: ${ICI_APP_DB_USER:?Set ICI_APP_DB_USER in infra/compose/.env}
      ICI_APP_DB_PASSWORD: ${ICI_APP_DB_PASSWORD:?Set ICI_APP_DB_PASSWORD in infra/compose/.env}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8.2.1-alpine3.22
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/compose/.env}
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/compose/.env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in infra/compose/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in infra/compose/.env}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:?Set S3_QUARANTINE_BUCKET in infra/compose/.env}
      S3_CLEAN_BUCKET: ${S3_CLEAN_BUCKET:?Set S3_CLEAN_BUCKET in infra/compose/.env}
    volumes:
      - ./minio-policies:/policies:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_QUARANTINE_BUCKET}" &&
        mc mb --ignore-existing "local/$${S3_CLEAN_BUCKET}" &&
        mc anonymous set none "local/$${S3_QUARANTINE_BUCKET}" &&
        mc anonymous set none "local/$${S3_CLEAN_BUCKET}" &&
        (mc admin user add local "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" || true) &&
        sed -e "s/__QUARANTINE_BUCKET__/$${S3_QUARANTINE_BUCKET}/g" -e "s/__CLEAN_BUCKET__/$${S3_CLEAN_BUCKET}/g" /policies/ici-document-storage.json > /tmp/ici-document-storage.json &&
        (mc admin policy create local ici-document-storage /tmp/ici-document-storage.json || true) &&
        mc admin policy attach local ici-document-storage --user "$${S3_ACCESS_KEY_ID}"

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, clamdscan --ping 1 >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  minio_data:
  postgres_data:
  redis_data:
