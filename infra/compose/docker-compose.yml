---
name: ici-archivos

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/compose/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/compose/.env}
      ICI_APP_DB_USER: ${ICI_APP_DB_USER:?Set ICI_APP_DB_USER in infra/compose/.env}
      ICI_APP_DB_PASSWORD: ${ICI_APP_DB_PASSWORD:?Set ICI_APP_DB_PASSWORD in infra/compose/.env}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8.2.1-alpine3.22
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/compose/.env}
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/compose/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/compose/.env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in infra/compose/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in infra/compose/.env}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:?Set S3_QUARANTINE_BUCKET in infra/compose/.env}
      S3_CLEAN_BUCKET: ${S3_CLEAN_BUCKET:?Set S3_CLEAN_BUCKET in infra/compose/.env}
    volumes:
      - ./minio-policies:/scripts:ro
    entrypoint: [/bin/sh, /scripts/minio-init.sh]

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, clamdscan --ping 1 >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [node, infra/compose/migrate.mjs]

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${ICI_APP_DB_USER}:${ICI_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_CONNECT_TIMEOUT_MS: ${CLAMAV_CONNECT_TIMEOUT_MS:-5000}
      CLAMAV_READ_TIMEOUT_MS: ${CLAMAV_READ_TIMEOUT_MS:-30000}
      MALWARE_POLL_INTERVAL_MS: ${MALWARE_POLL_INTERVAL_MS:-1000}
      MALWARE_LEASE_SECONDS: ${MALWARE_LEASE_SECONDS:-300}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in infra/compose/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in infra/compose/.env}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:?Set S3_QUARANTINE_BUCKET in infra/compose/.env}
      S3_CLEAN_BUCKET: ${S3_CLEAN_BUCKET:?Set S3_CLEAN_BUCKET in infra/compose/.env}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

volumes:
  minio_data:
  postgres_data:
  redis_data:
